{% if form.errors %}<div class="map-alert map-alert-error map-error-summary" role="alert" tabindex="-1" data-error-summary><h2>Bitte die markierten Angaben prüfen</h2><ul>{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.auto_id }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}</ul></div>{% endif %}
