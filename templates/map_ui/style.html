<style>
:root,:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:light;--primary:#246e9a;--secondary:#233f4c;--accent:#e8b84d;--primary-fg:#fff;--body-fg:#233f4c;--body-bg:#faf8f3;--body-quiet-color:#53656c;--body-loud-color:#233f4c;--header-color:#fff;--header-branding-color:#fff;--header-bg:#233f4c;--header-link-color:#fff;--breadcrumbs-fg:#526f63;--breadcrumbs-link-fg:#246e9a;--breadcrumbs-bg:#fff;--link-fg:#246e9a;--link-hover-color:#1d587b;--link-selected-fg:#1d587b;--hairline-color:#e4ece7;--border-color:#dfe6e9;--darkened-bg:#eef4ef;--selected-bg:#e6f1e9;--selected-row:#edf6ef;--button-fg:#fff;--button-bg:#246e9a;--button-hover-bg:#1d587b;--default-button-bg:#246e9a;--default-button-hover-bg:#1d587b;--close-button-bg:#53656c;--close-button-hover-bg:#53656c;--delete-button-bg:#a73535;--delete-button-hover-bg:#842626;--object-tools-fg:#fff;--object-tools-bg:#246e9a;--object-tools-hover-bg:#1d587b}

*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--body-fg);background:var(--body-bg);line-height:1.6}
a{color:#246e9a;text-underline-offset:4px}
button,input,select,textarea{font:inherit}
a,button,input,select,textarea,summary{outline-offset:4px}
button,a,input,summary{touch-action:manipulation}
:focus-visible{outline:3px solid #e8b84d}
.map-topbar{min-height:84px;background:#fff;border-bottom:1px solid #e0e9e3;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px max(24px,calc((100vw - 1200px)/2));position:relative;z-index:30;color:#233f4c}
.map-brand{display:flex;align-items:center;gap:12px;text-decoration:none!important;color:#233f4c!important}
.map-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#246e9a;color:#f0c382;font-weight:900;font-size:27px;line-height:1}
.map-brand strong{display:block;font-size:24px;letter-spacing:-1px;line-height:1.1}
.map-brand small{display:block;font-size:11px;font-weight:500;color:#53656c;margin-top:4px}
.map-nav{display:flex;align-items:center;gap:20px;font-size:14px}
.map-nav>a{color:#3d5c4e!important;text-decoration:none;font-weight:600}
.map-menu{position:relative}
.map-menu summary{list-style:none;cursor:pointer;border:1px solid #dfe6e9;border-radius:12px;padding:10px 15px;background:#f5f8fa;font-weight:600;font-size:13px;color:#233f4c}
.map-menu summary::-webkit-details-marker{display:none}
.map-menu summary::after{content:' ⌄';margin-left:10px}
.map-menu[open] .map-menu-panel{display:block}
.map-menu-panel{position:absolute;right:0;top:calc(100% + 10px);min-width:230px;padding:8px;border:1px solid #dfe6e9;background:white;border-radius:16px;box-shadow:0 16px 48px #233f4c20;color:#233f4c}
.map-menu-panel a,.map-menu-panel button{display:block;width:100%;padding:10px 12px;text-align:left;background:none;border:0;border-radius:8px;text-decoration:none;color:#233f4c!important;cursor:pointer;font-size:14px}
.map-menu-panel a:hover,.map-menu-panel button:hover{background:#edf3f7}
.map-menu-panel form{margin:0}
.map-main{max-width:1200px;margin:0 auto;padding:44px 24px 64px;min-height:calc(100vh - 176px)}
.map-footer{max-width:1200px;margin:0 auto;padding:22px 24px;border-top:1px solid #dfe8e1;display:flex;justify-content:space-between;gap:16px;font-size:12px;color:#53656c}
.map-kicker{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:800;color:#365d45;margin:0 0 12px}
.map-title,h1{font-size:clamp(28px,4vw,44px);font-weight:750;letter-spacing:-1.5px;line-height:1.15;color:#153f32;margin:0 0 16px}
.map-lead{color:#53656c;font-size:16px;max-width:580px}
.map-hero{display:grid;grid-template-columns:1.5fr 1fr;background:#233f4c;color:white;border-radius:26px;padding:clamp(28px,5vw,60px);gap:32px;margin-bottom:38px;overflow:hidden}
.map-hero .map-kicker{color:#e4edf2}
.map-hero h1{font-size:clamp(34px,5vw,57px);color:#fff;max-width:600px}
.map-hero p{color:#e4edf2;max-width:470px}
.map-hero-art{align-self:center;justify-self:center;width:180px;height:180px;border:1px solid #ffffff25;border-radius:50%;display:grid;place-items:center;position:relative}
.map-hero-art::before{content:'';position:absolute;width:126px;height:126px;border:1px dashed #ffffff45;border-radius:50%}
.map-hero-art span{display:grid;place-items:center;transform:rotate(-12deg);width:75px;height:75px;border-radius:22px;background:#edbf7a;color:#233f4c;font-size:43px;box-shadow:12px 14px 0 #ffffff0c}
.map-section-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:26px 0 18px}
.map-section-head h2{margin:0;font-size:23px;letter-spacing:-.7px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.map-card,.map-panel,.map-public section,.map-public article{background:#fff;border:1px solid #dfe6e9;border-radius:20px;padding:28px;margin:0;box-shadow:0 5px 18px #1d483803}
.map-card{display:flex;flex-direction:column;gap:12px}
.map-card h2,.map-card h3{font-size:22px;line-height:1.3;letter-spacing:-.6px;margin:3px 0}
.map-card h2 a,.map-card h3 a{color:#183f32;text-decoration:none}
.map-card p{margin:0;color:#53656c}
.map-card .map-card-bottom{margin-top:auto;padding-top:20px;border-top:1px solid #edf2ee;display:flex;justify-content:space-between;align-items:center;gap:12px}
.map-badge{display:inline-flex;align-self:flex-start;align-items:center;padding:5px 11px;border-radius:99px;font-size:11px;font-weight:700;background:#e9f3eb;color:#34724e}
.map-date{font-size:12px;color:#53656c}
.map-button,.map-public button,.map-public .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#246e9a;color:#fff!important;padding:12px 18px;border:0;border-radius:11px;text-decoration:none;font-weight:650;font-size:13px;cursor:pointer;min-height:44px}
.map-button:hover,.map-public button:hover{background:#1d587b}
.map-button-secondary{background:#edf3f7;color:#22563e!important}
.map-public .danger{background:#a73535}
.map-public p{margin:0 0 18px}
.map-public form p{margin-bottom:20px}
.map-public label{display:block;font-size:13px;font-weight:650;color:#365746;margin-bottom:7px}
.map-public input:not([type=checkbox]):not([type=radio]):not([type=hidden]),.map-public select,.map-public textarea{display:block;width:100%;min-height:46px;padding:11px 13px;background:#fbfdfb;border:1px solid #d5e1d8;border-radius:10px;color:#233f4c}
.map-public input[type=checkbox],.map-public input[type=radio]{accent-color:#246e9a;width:17px;height:17px;vertical-align:middle}
.map-public textarea{min-height:120px;resize:vertical}
.map-public .helptext{display:block;font-size:12px;color:#53656c;margin-top:6px}
.map-public .errorlist{background:#fff1ef;color:#9b3030;padding:12px 20px;border-radius:10px;font-size:13px;list-style:none}
.map-alert{padding:14px 18px;border:1px solid #cfe5d2;border-radius:12px;background:#eaf5ec;margin-bottom:20px;font-size:14px}
.map-empty{padding:48px 24px;text-align:center;border:1px dashed #cbdccf;border-radius:20px;color:#53656c;background:#f9fcf9}
.map-login{display:grid;grid-template-columns:1fr 1fr;max-width:980px;margin:32px auto;border:1px solid #dfe6e9;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 22px 70px #233f4c08}
.map-login-story{padding:48px;background:#233f4c;color:white;display:flex;flex-direction:column;justify-content:center}
.map-login-story h1{color:#fff;font-size:42px}
.map-login-story p{color:#e4edf2}
.map-login-form{padding:44px}
.map-login-form h2{font-size:26px;letter-spacing:-.7px;margin:12px 0 6px}
.map-login-form .map-button{width:100%;margin-top:6px}
.map-muted{font-size:13px;color:#53656c}
.map-form-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,1fr);gap:24px;margin-top:28px}
.map-stack>*+*{margin-top:24px!important}
.map-panel h2,.map-public section h2{font-size:20px;margin:0 0 18px;letter-spacing:-.5px}
.map-table-wrap,.map-public .table-wrap{overflow:auto;border:1px solid #dfe6e9;border-radius:16px;background:#fff}
.map-public table{width:100%;border-collapse:collapse;font-size:13px}
.map-public td,.map-public th{padding:15px 18px;text-align:left;vertical-align:top;border-bottom:1px solid #e8eee9}
.map-public th{background:#f6faf6;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#53656c}
.map-public td small{display:block}
.map-public tbody tr:last-child td{border-bottom:0}
.map-actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.map-admin #header{padding:0;background:#fff;display:block;height:auto;color:#233f4c}
.map-admin #branding{float:none;width:100%}
.map-admin #header .map-nav{margin:0}
.map-admin #content{padding:32px;max-width:1500px}
.map-admin h1{font-size:30px;letter-spacing:-1px}
.map-admin #nav-sidebar{background:#f5f8fa;border-right:1px solid #dfe6e9}
.map-admin #nav-filter{margin:16px 12px;width:calc(100% - 24px);padding:10px;border-radius:10px}
.map-admin div.breadcrumbs{padding:14px 32px;border-bottom:1px solid #dfe6e9;font-size:12px}
.map-admin .module{background:white;border:1px solid #dfe6e9;border-radius:14px;overflow:hidden;margin-bottom:24px}
.map-admin .module h2,.map-admin .module caption{background:#edf3f7;color:#234f68;padding:14px;font-size:12px;font-weight:700}
.map-admin .module caption a{color:#234f68}
.map-admin #content-main>.module{box-shadow:0 5px 20px #233f4c03}
.map-admin #changelist{border-radius:16px;border:1px solid #dfe6e9;overflow:hidden}
.map-admin #changelist-filter{background:#f5f8fa}
.map-admin #changelist-filter h2{background:#edf3f7;color:#234f68}
.map-admin input[type=text],.map-admin input[type=password],.map-admin input[type=email],.map-admin input[type=number],.map-admin input[type=url],.map-admin textarea,.map-admin select{padding:10px;border:1px solid #d5e1d8;border-radius:8px;background:#fff;color:#233f4c;max-width:100%}
.map-admin .submit-row{background:#edf3f7;border:1px solid #dce7de;border-radius:14px;padding:18px}
.map-admin .button,.map-admin input[type=submit],.map-admin button[type=submit]{border-radius:9px;padding:11px 17px}
.map-admin .object-tools a{border-radius:9px;padding:10px 16px}
.map-admin #toolbar{background:#fff;border:0;border-bottom:1px solid #dfe6e9;padding:18px}
.map-admin .form-row{padding:18px;border-color:#e5ece7}
.map-admin .aligned label{font-size:13px;color:#365746}
.map-admin table thead th{background:#f0f6f1;color:#365744}
.map-admin .row1{background:#fff}
.map-admin .row2{background:#f5f8fa}
.map-admin .messagelist li{border-radius:10px;margin:12px 24px}
.map-admin #container{min-width:0}
.map-admin #content-related{background:#edf3f7;border-radius:14px}
.map-admin #content-related .module{background:transparent;border:0}

@media(max-width:800px){.map-topbar{padding:14px 18px;gap:10px}
.map-brand small{display:none}
.map-nav{gap:10px}
.map-nav>a{display:none}
.map-main{padding:28px 18px 40px}
.map-hero{grid-template-columns:1fr;padding:30px}
.map-hero-art{display:none}
.map-login{grid-template-columns:1fr;margin:0}
.map-login-story{padding:30px}
.map-login-story h1{font-size:30px}
.map-login-form{padding:28px}
.map-form-layout{grid-template-columns:1fr}
.map-footer{flex-direction:column;padding:18px}
.map-admin #content{padding:20px 14px}
.map-admin div.breadcrumbs{padding:12px 18px}
.map-card,.map-panel,.map-public section{padding:22px}
.map-section-head{align-items:flex-start}
.map-menu-panel{max-width:calc(100vw - 36px)}
}


.map-menu summary{display:flex;align-items:center;justify-content:space-between;gap:14px;line-height:1.35;min-height:44px;color:#233f4c;background:#f1f6f2}

.map-menu summary::after{content:"";display:block;width:7px;height:7px;flex:0 0 7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);margin:0;align-self:center}

.map-menu[open] summary::after{transform:translateY(2px) rotate(225deg)}

.map-muted,.map-date,.map-public .helptext,.map-brand small{color:#53656c}
.map-login-story .map-muted{color:#e4edf2}
.map-badge{color:#215037;background:#e7f1e8}
.map-card p{color:#53656c}
.map-admin .help,.map-admin .helptext,.map-admin .quiet,.map-admin .small,.map-admin #content-related p{color:#53656c}
.map-admin label,.map-admin td,.map-admin th{color:#254b38}
.map-admin input::placeholder,.map-public input::placeholder{color:#536e5e;opacity:1}

.map-admin.dashboard #content{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;max-width:1500px;width:100%;margin:0 auto;box-sizing:border-box}
.map-admin.dashboard #content>h1{grid-column:1/-1;margin-bottom:0}
.map-admin.dashboard #content-main{float:none;width:auto;min-width:0;margin:0}
.map-admin.dashboard #content-related{float:none;width:auto;min-width:0;margin:0;padding:0;background:transparent}
.map-admin.dashboard #content>.clear{grid-column:1/-1}
.map-admin-intro{padding:26px;background:#233f4c;border-radius:18px;margin-bottom:24px;color:#fff}
.map-admin-intro h2{color:#fff;font-size:23px;margin:0 0 10px;letter-spacing:-.5px}
.map-admin-intro p{color:#e4edf2;margin:0 0 20px;font-size:14px}
.map-admin-intro .map-button{background:#edbf7a;color:#233f4c!important}
.map-help{background:white;border:1px solid #dfe6e9;border-radius:18px;overflow:hidden}
.map-help-heading{padding:24px;background:#edf3f7;border-bottom:1px solid #dfe6e9}
.map-help-heading h2{font-size:20px;color:#233f4c;margin:0 0 8px}
.map-help-heading p{font-size:13px;margin:0;color:#53656c}
.map-help details{border-bottom:1px solid #e1e9e3}
.map-help details:last-child{border-bottom:0}
.map-help summary{padding:16px 20px;cursor:pointer;font-size:13px;font-weight:750;color:#233f4c;line-height:1.5}
.map-help details[open] summary{background:#f2f7f3}
.map-help-body{padding:4px 20px 20px;font-size:13px;color:#33434b}
.map-help-body p,.map-help-body li{font-size:13px;line-height:1.75;color:#33434b}
.map-help-body ol,.map-help-body ul{padding-left:20px;margin:12px 0}
.map-help-body a{font-weight:650}
.map-help-body strong{color:#233f4c}
.map-wizard{max-width:1050px}
.map-wizard-steps{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 28px}
.map-wizard-steps li{font-size:12px;background:#e8efe9;color:#33434b;padding:9px 12px;border-radius:8px}
.map-wizard-steps li.is-current{background:#246e9a;color:#fff;font-weight:750}
.map-wizard-steps li.is-done{background:#dcebdd;color:#214d34}
.map-wizard-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px}
.map-wizard-tip{background:#edf3f7;border:1px solid #d7e4d9;border-radius:16px;padding:22px;align-self:start;color:#274b37}
.map-wizard-tip h3{margin:0 0 10px;font-size:17px;color:#233f4c}
.map-wizard-tip p{font-size:13px;color:#33434b}
.map-wizard-review{margin:0 0 24px}
.map-wizard-review div{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;padding:13px 0;border-bottom:1px solid #e1e9e3}
.map-wizard-review dt{font-size:12px;font-weight:750;color:#53656c}
.map-wizard-review dd{margin:0;font-size:14px;color:#233f4c;overflow-wrap:anywhere}
.map-wizard .map-actions{justify-content:space-between}
.map-wizard fieldset{border:0;padding:0;margin:0}
.map-wizard select[multiple]{min-height:150px}
.map-wizard input[type=checkbox]+label{display:inline}
.map-wizard .map-panel{min-width:0}

@media(min-width:1100px){.map-admin.dashboard #content-related{align-self:start;position:sticky;top:20px}
}

@media(max-width:1100px){.map-admin.dashboard #content{grid-template-columns:1fr}
.map-wizard-shell{grid-template-columns:1fr}
.map-admin.dashboard #content-related{position:static}
}

@media(max-width:600px){.map-wizard-review div{grid-template-columns:1fr;gap:4px}
.map-menu summary{padding:10px 12px}
.map-admin.dashboard #content{padding:22px 14px}
.map-wizard-steps li{font-size:11px;padding:7px 9px}
}


/* Consistent form geometry and readable confirmation messages. */

.map-admin ul.messagelist li.success a{color:#124c2c!important;text-decoration:underline;font-weight:750}
.map-admin ul.messagelist li.warning{background:#fff4d9!important;color:#573f10!important}
.map-admin ul.messagelist li.error{background:#ffeded!important;color:#812a2a!important}
.map-admin .submit-row input{letter-spacing:0!important;text-transform:none!important}
.map-admin input[type=checkbox],.map-public input[type=checkbox]{accent-color:#246e9a;width:18px;height:18px;flex:0 0 18px;margin:0!important;vertical-align:middle}
.map-check-label,.map-public .map-check-label,.map-admin .checkbox-row{display:flex!important;align-items:flex-start;gap:12px;line-height:1.6;margin:0!important}
.map-check-label input{margin-top:3px!important}
.map-field{margin:0 0 24px;min-width:0}
.map-field-check{background:#f2f7f3;border:1px solid #dce8df;padding:16px 18px;border-radius:12px}

.map-public .map-field>label{margin-bottom:9px}
.map-required{color:#8b3030}
.map-field [id=id_viewers],.map-field [id=id_editors],.map-field [id=id_groups]{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.map-field [id=id_viewers] label,.map-field [id=id_editors] label,.map-field [id=id_groups] label{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0;background:#f5f8fa;border:1px solid #d9e6dd;border-radius:10px}
.map-choice-disabled{background:#edf0ed!important;color:#69756d!important;border-style:dashed!important;cursor:not-allowed}
.map-group-limits{display:grid;gap:10px}

.map-group-limit>div{display:flex;align-items:center;gap:8px;font-size:12px;color:#53656c}
.map-group-limit input[type=number]{width:90px!important;min-width:75px}
.map-quota-summary{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #dfebe2;padding:12px 0;font-size:13px}

.map-datetime{position:relative;min-width:0}
.map-date-controls{display:grid;grid-template-columns:minmax(170px,1fr) 110px;gap:10px}

.map-public .map-date-open,.map-admin .map-date-open{display:block;width:100%;min-height:46px;padding:11px 14px;text-align:left;background:#fff!important;color:#233f4c!important;border:1px solid #ccdcd0!important;border-radius:10px;font-weight:550;font-size:14px}

.map-time-presets{grid-column:1/-1;display:flex;gap:8px}
.map-public .map-time-presets button,.map-admin .map-time-presets button{background:#eaf3ec!important;color:#214e35!important;border:1px solid #ccdfd1;padding:7px 14px;min-height:34px;border-radius:8px;font-size:12px;font-weight:650}
.map-calendar{position:absolute;left:0;top:55px;width:320px;max-width:calc(100vw - 60px);z-index:65;background:white;border:1px solid #cdded2;border-radius:16px;padding:16px;box-shadow:0 18px 55px #123c3326}
.map-calendar-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;color:#233f4c;font-size:14px}

.map-calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}

.map-topbar{position:relative;z-index:50;overflow:visible!important;flex:none;gap:24px}
