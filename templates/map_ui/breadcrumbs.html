{% if map_breadcrumbs %}<nav class="map-breadcrumbs" aria-label="Navigationspfad"><ol>{% for crumb in map_breadcrumbs %}<li>{% if crumb.url %}<a href="{{ crumb.url }}">{{ crumb.label }}</a>{% else %}<span aria-current="page">{{ crumb.label }}</span>{% endif %}</li>{% endfor %}</ol></nav>{% endif %}
