{% if delivery.protected %}<span class="mail-template-state is-required" title="Für Anmeldung, Kontosicherheit oder einen ausdrücklich angeforderten Versand erforderlich. Kann nicht abgeschaltet werden.">Erforderlich · aktiv</span>{% else %}<form method="post" action="{% url 'set_mail_template_state' delivery.scope template_key %}" class="mail-template-status-form">{% csrf_token %}<button type="submit" class="mail-template-state {% if delivery.enabled %}is-on{% else %}is-off{% endif %}" aria-pressed="{% if delivery.enabled %}true{% else %}false{% endif %}" name="enabled" value="{% if delivery.enabled %}0{% else %}1{% endif %}" aria-label="{{ template_title }}: {% if delivery.enabled %}deaktivieren{% else %}aktivieren{% endif %}" title="Klicken zum {% if delivery.enabled %}Deaktivieren{% else %}Aktivieren{% endif %}">{% if delivery.enabled %}Aktiv{% else %}Deaktiviert{% endif %}</button></form>{% endif %}
