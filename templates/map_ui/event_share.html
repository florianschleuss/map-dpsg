{% if event.published %}<div class="map-share-entry"><button type="button" class="map-button map-button-quiet" data-open-dialog="share-event-{{ event.pk }}">↗ Anmeldelink</button></div><dialog id="share-event-{{ event.pk }}" class="map-dialog" aria-labelledby="share-title-{{ event.pk }}"><div class="map-dialog-header"><div><div class="map-kicker">Anmeldung teilen</div><h2 id="share-title-{{ event.pk }}">{{ event.title }}</h2></div><button type="button" class="map-dialog-close" data-close-dialog aria-label="Popup schließen">×</button></div><div class="map-share" data-event-share>
<label for="share-url-{{ event.pk }}">Anmeldelink</label><div class="map-copy-field"><input id="share-url-{{ event.pk }}" type="url" readonly value="{{ event.registration_url }}" data-share-url><button type="button" class="map-button" data-copy-link autofocus>Link kopieren</button></div><p class="map-muted">Dieser Link führt direkt zur Anmeldung.</p>
<div class="map-share-qr"><img class="map-qr-image" src="{% url 'event_qr' event.pk %}" alt="QR-Code zur Anmeldung für {{ event.title }}" width="240" height="240" loading="lazy"><div class="map-actions"><button type="button" class="map-button map-button-secondary" data-copy-qr data-qr-url="{% url 'event_qr' event.pk %}">QR-Code als Bild kopieren</button><a class="map-button map-button-secondary" href="{% url 'event_qr' event.pk %}" download="anmeldung-qr.png">PNG herunterladen</a></div></div><p role="status" aria-live="polite" data-share-status></p></div></dialog>{% endif %}
