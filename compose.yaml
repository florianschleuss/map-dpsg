name: ${COMPOSE_PROJECT_NAME:-map}
x-app: &app
  build: .
  image: ${MAP_IMAGE:-map-local:latest}
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    <<: *app
    environment:
      STATIC_ROOT: /tmp/map-static
    command: [/bin/sh, -c, 'python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile /dev/null --error-logfile - --forwarded-allow-ips=""']
    healthcheck:
      test: [CMD, python, checks/healthcheck.py]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
  worker:
    <<: *app
    command: [python, manage.py, process_queue, --loop]
  init:
    <<: *app
    profiles: [tools]
    restart: "no"
    command: [python, manage.py, migrate, --noinput]
  test-db:
    image: postgres:16-alpine
    profiles: [tools]
    environment:
      POSTGRES_DB: maptest
      POSTGRES_USER: maptest
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U maptest -d maptest']
      interval: 3s
      timeout: 5s
      retries: 20
  test:
    <<: *app
    profiles: [tools]
    restart: "no"
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: test-db
      POSTGRES_DB: maptest
      POSTGRES_USER: maptest
      POSTGRES_PASSWORD: isolated-test-only
      HTTPS: "0"
      DEBUG: "0"
      SQLITE_TEST: "0"
      MAP_TRUSTED_PROXY_HOSTS: ""
      MAP_ORGANIZATION: Dein Pfadfinderstamm
      MAP_IMPRINT_URL: ""
      MAP_MAIL_SENDER_NAME: Anmeldungsverwaltung
      MAP_LOGO_PATH: map/logo.svg
      MAP_FAVICON_PATH: map/logo.svg
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    command: [/bin/sh, -c, 'python -m pip check && python checks/dependency_checks.py && python checks/vulnerability_checks.py && python manage.py check && python manage.py makemigrations --check --dry-run && python manage.py test map --verbosity 2 --noinput']
volumes:
  postgres_data:
