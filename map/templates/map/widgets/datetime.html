<div class="map-datetime" data-map-datetime><input type="{{ widget.type|default:'datetime-local' }}" name="{{ widget.name }}" {% if widget.value != None %}value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include 'django/forms/widgets/attrs.html' %}><div class="map-date-controls" hidden><div class="map-date-column"><button type="button" class="map-date-open" aria-haspopup="dialog" aria-expanded="false">Datum auswählen</button><button type="button" data-time="now">Jetzt</button></div><div class="map-time-column"><input type="time" class="map-time-input" aria-label="Uhrzeit"><div class="map-time-presets" aria-label="Uhrzeit auswählen"><button type="button" data-time="00:00">0 Uhr</button><button type="button" data-time="09:00">9 Uhr</button><button type="button" data-time="17:00">17 Uhr</button></div></div></div><div class="map-calendar" role="dialog" aria-label="Datum auswählen" hidden></div></div>
