<div class="map-template-picker" data-template-picker data-event-id="{{ widget.event_id|default:'' }}" data-options-url="{{ widget.options_url }}"><div class="map-template-select">{% include 'django/forms/widgets/select.html' %}</div><a class="map-icon-button" data-template-edit href="{{ widget.edit_url|default:'#' }}" target="_blank" rel="noopener" aria-label="Ausgewählte Formularvorlage bearbeiten" title="Formularvorlage bearbeiten">✎</a>{% if widget.can_create %}<a class="map-icon-button" href="{{ widget.create_url }}" target="_blank" rel="noopener" aria-label="Neue Formularvorlage anlegen" title="Neue Formularvorlage anlegen">＋</a>{% endif %}</div>
