<div class="map-group-limits" data-group-limits><input type="hidden" name="{{ widget.name }}" value="{{ widget.value }}"{% include 'django/forms/widgets/attrs.html' %}>{% for group in widget.groups %}<div class="map-group-limit"><label><input type="checkbox" data-group-id="{{ group.id }}" {% if group.selected %}checked{% endif %}><span>{{ group.name }}</span></label><div><input type="number" min="1" step="1" value="{{ group.capacity }}" data-limit-for="{{ group.id }}" aria-label="Plätze für {{ group.name }}" {% if not group.selected %}disabled{% endif %}><span>Plätze</span></div></div>{% empty %}<p>Lege zunächst mindestens eine Gruppe an.</p>{% endfor %}<noscript>Zum Ändern der Gruppenauswahl wird JavaScript benötigt.</noscript></div>
