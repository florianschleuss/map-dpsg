<a class="room-calendar-entry room-{{ item.entry.status }}" href="{% url 'rooms:detail' item.booking.pk %}" title="{{ item.entry.purpose }} - {{ item.entry.grouping }} · {{ item.period }} · {% for room in item.entry.rooms.all %}{{ room.name }}{% if not forloop.last %}, {% endif %}{% endfor %}"><strong>{{ item.entry.purpose }} - {{ item.entry.grouping }}</strong><span>{{ item.clock }} · {% for room in item.entry.rooms.all %}{{ room.name }}{% if not forloop.last %}, {% endif %}{% endfor %}</span><span>{% if item.proposal %}Änderungsantrag · nicht freigegeben{% else %}{{ item.entry.get_status_display }}{% endif %}</span></a>
